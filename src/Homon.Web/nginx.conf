# The SPA container's nginx: serves the bundle, and is the ONE PUBLIC ORIGIN for the whole
# application — `/api/` is proxied to the api container on the Compose network below, so a
# deployment publishes exactly one port and the browser never sees a second host. That is
# what keeps the session cookie first-party and CORS out of the picture entirely.
#
# Cache-Control lives in a map rather than in a location, and that is the whole point of
# this block. A header directive set inside a location suppresses every one of its kind set
# at server level — and try_files' last argument is an internal redirect that re-runs
# location matching, so every HTML document here is actually served by `location /`. If the
# security headers below were emitted only from a location, that redirect would mean they
# landed on no HTML document at all — the response class where CSP and frame protection
# matter most — while `nginx -t` passed happily. Routing cache-control through this map
# means no location sets a header of its own, which removes the trap by construction. Do not
# "simplify" this back into the locations.
map $uri $homon_cache {
    default      "no-cache";
    ~^/assets/   "public, max-age=31536000, immutable";
}

# The scheme the CLIENT used, which is not necessarily the scheme this server was reached
# with. Behind a WAF, TLS terminates there and this nginx is reached over plain :80, so
# $scheme reads "http" for a request the browser made over HTTPS — and the API, reading
# X-Forwarded-Proto, would mark the session cookie non-Secure on exactly the deployment
# where Secure matters most. Honour an upstream value when there is one, fall back to
# $scheme when there is not (the LAN case, where the fallback is the correct answer).
#
# Only the two literal values are passed through: a comma-joined list from a double proxy,
# or anything unexpected, falls back to $scheme rather than travelling on uninspected.
#
# Deliberately NOT keyed on $remote_addr. Under rootless Docker the published port is
# SNATed, so a LAN client and the WAF arrive from the same address inside this container —
# there is nothing to discriminate on. A client CAN therefore claim "https" over plain HTTP;
# the only effect is that the API marks that client's own cookie Secure and its own browser
# then refuses to store it. Stripping Secure on the WAF path is not reachable, because the
# WAF sets this header itself and replaces whatever the client sent.
map $http_x_forwarded_proto $homon_forwarded_proto {
    default  $scheme;
    "http"   "http";
    "https"  "https";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $homon_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Report-only first: nothing collects reports yet, so this is walked by hand in the
    # browser console before it ever enforces anything. `style-src 'unsafe-inline'` is what
    # Tailwind's runtime-free output does not need but a WYSIWYG editor's rendered pages
    # might; revisit when the Pages module lands. frame-ancestors is ignored in a
    # report-only header per spec; X-Frame-Options: DENY above does that job until this
    # flips to enforced.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The API. `api` is the Compose service name, resolved by Docker's embedded DNS; 8080 is
    # ASPNETCORE_HTTP_PORTS in the api image. No trailing slash on proxy_pass and no path:
    # with either, nginx rewrites the URI and the `/api/v1` prefix the application routes on
    # is stripped, so every request 404s.
    #
    # X-Forwarded-For / -Proto are what the API's forwarded-headers middleware reads when
    # ReverseProxy__KnownNetwork names this container's network — that is how the sign-in
    # rate limiter partitions on the real client instead of on this proxy's address.
    # $proxy_add_x_forwarded_for APPENDS to whatever the client sent, which is why the API
    # trusts exactly one hop and takes the rightmost entry.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $homon_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 8m;
    }

    # The API's own health endpoint lives at its root (/health), outside /api/v1, because
    # the container healthcheck reaches it directly. Exposed here at /api/health so an
    # external uptime check on the one public port has something honest to poll.
    location = /api/health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
    }

    # Client-side routing: unknown paths are React Router's problem, not nginx's.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy would not
    # be picked up. Caching is decided by the $homon_cache map above, not here — this
    # location sets no header of its own.
    location /assets/ {
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
